name: Publish news

on:
  schedule:
    # Toshkent jadvali UTC dan 5 soat oldinda. Navbat yukini kamaytirish uchun 3 daqiqa qo‘shiladi.
    - cron: '3 4,7,8,10,12,13 * * *'
    - cron: '27 6 * * *'
    - cron: '51 8 * * *'
    - cron: '15 11 * * *'
    - cron: '39 13 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: telegram-news-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.RENDER_SERVICE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
      SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
    steps:
      - name: Trigger the publishing cycle
        shell: bash
        run: |
          test -n "$SCHEDULER_SECRET" || { echo 'SCHEDULER_SECRET is missing.'; exit 1; }
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 120 \
            --proto '=https' --request POST \
            --header "Authorization: Bearer $SCHEDULER_SECRET" \
            "${SERVICE_URL%/}/internal/publish"
